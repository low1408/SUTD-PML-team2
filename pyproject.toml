[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sepsis-warning-sketch"
version = "0.1.0"
description = "Classical ML sepsis early-warning research scaffold"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scipy>=1.15,<2",
    "scikit-learn>=1.6,<1.8",
    "joblib>=1.3,<2",
]

[project.scripts]
sepsis-warning = "sepsis_warning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sepsis_warning = ["report_template.html"]
