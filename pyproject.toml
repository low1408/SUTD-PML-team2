[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sepsis-warning-sketch"
version = "0.1.0"
description = "Classical ML sepsis early-warning research scaffold"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scipy>=1.15,<2",
    "scikit-learn>=1.6,<1.8",
    "joblib>=1.3,<2",
    "pyarrow>=19,<25",
    "matplotlib>=3.10,<4",
]

[project.optional-dependencies]
# L01, approved by the team owner on 2026-11-09. Local stores only by default.
tracking = ["mlflow>=2.17,<4"]
# L02 research API. FastAPI pulls in pydantic and starlette.
serve = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
# Only needed to run the API tests (FastAPI's TestClient).
test = ["httpx>=0.27,<1"]
notebook = ["ipykernel>=7,<8"]
checks = ["pandera==0.35.0"]
dvc = ["dvc==3.67.1"]

[project.scripts]
sepsis-warning = "sepsis_warning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sepsis_warning = ["report_template.html", "ward_template.html"]
