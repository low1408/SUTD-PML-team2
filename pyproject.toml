[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sepsis-warning-sketch"
version = "0.1.0"
description = "Classical ML sepsis early-warning research scaffold"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scipy>=1.15,<2",
    "scikit-learn>=1.6,<1.8",
    "joblib>=1.3,<2",
    "pyarrow>=19,<25",
    "matplotlib>=3.10,<4",
]

[project.optional-dependencies]
# L01, approved by the team owner on 2026-11-09. Local stores only by default.
tracking = ["mlflow>=3.0,<4"]
# L02 research API. FastAPI pulls in pydantic and starlette.
serve = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
# Only needed to run the API tests (FastAPI's TestClient).
test = ["httpx>=0.27,<1"]
# AWS: load published bundles from S3 (serve --model-s3, publish).
aws = ["boto3>=1.34,<2"]
# Serverless scoring on AWS Lambda (the same FastAPI app through Mangum).
lambda = ["mangum>=0.17,<1", "boto3>=1.34,<2", "awslambdaric>=3,<5"]
# SageMaker AI serverless MLflow App as the tracking store (its ARN is the tracking URI).
sagemaker = ["sagemaker-mlflow>=0.5,<1", "boto3>=1.34,<2"]
# Hosted tools on ECS: the MLflow tracking server (PostgreSQL backend, S3 artifacts) and Evidently monitoring.
tools = ["mlflow>=3.0,<4", "psycopg2-binary>=2.9,<3", "boto3>=1.34,<2", "evidently>=0.7,<0.8"]
notebook = ["ipykernel>=7,<8"]
checks = ["pandera==0.35.0"]
dvc = ["dvc==3.67.1"]

[project.scripts]
sepsis-warning = "sepsis_warning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sepsis_warning = ["report_template.html", "ward_template.html", "models.toml", "tuning_space.toml"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
# Errors, likely bugs, outdated syntax and import order. Checked in CI on every pull request.
select = ["F", "E9", "B", "UP", "I"]
# B905 (zip strict=) and B007 (unused loop variable) would change existing analysis code; reviewed case by case.
ignore = ["B905", "B007"]

[tool.ruff.lint.isort]
known-first-party = ["sepsis_warning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
follow_imports = "silent"

[tool.pylint.main]
jobs = 0
ignore-paths = ["^src/sepsis_warning/.*_template.*"]

[tool.pylint.format]
max-line-length = 180

[tool.pylint."messages control"]
# Documentation is in the module docstrings and docs/; heavy imports are deliberately lazy so the CLI starts fast and
# tests run without boto3 or mlflow; the design-size checks (too-many-*) flag long analysis functions that are reviewed
# by hand; broad except clauses are each marked "noqa: BLE001" with the reason.
disable = [
  "missing-module-docstring", "missing-class-docstring", "missing-function-docstring",
  "import-outside-toplevel", "broad-exception-caught",
  "too-many-locals", "too-many-arguments", "too-many-positional-arguments", "too-many-statements", "too-many-branches",
  "too-many-instance-attributes", "too-many-return-statements", "too-many-lines", "too-few-public-methods",
  # scikit-learn convention: fitted attributes ("coef_") are created in fit(); optional packages are not all installed here.
  "attribute-defined-outside-init", "import-error",
  # "not len(array)" is deliberate where the value can be a numpy array (its truth value is ambiguous); scripts put their own
  # folder on sys.path before importing siblings; similar argument parsing in separate command-line scripts is not shared code.
  "use-implicit-booleaness-not-len", "wrong-import-position", "duplicate-code", "cyclic-import",
  # false positives: closures created in a loop, a loop that always returns or raises, numpy keyword arguments.
  "function-redefined", "inconsistent-return-statements", "unexpected-keyword-arg", "unused-argument", "unbalanced-tuple-unpacking",
]

[tool.pylint.basic]
# Matrix names from the maths (X, G, H, C, Z, GL...) and scikit-learn's X/C are kept as written in the papers and docs.
good-names-rgxs = "^[A-Z]{1,2}$"
good-names = ["i", "j", "k", "n", "_", "df", "ax", "fp", "fn", "tp", "tn"]
