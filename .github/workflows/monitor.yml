# Evidently monitoring on demand (no schedule):
#   reference  builds the reference of the served model from hospital A validation (once per model; needs MLflow on)
#   report     compares the last DAYS days of the scoring service's prediction log with that reference, writes the
#              report to S3 (reports/monitoring/), updates the Evidently UI's workspace and publishes the CloudWatch
#              metrics behind the drift alarm
# A drift result is a prompt to investigate, not proof that performance dropped. Nothing here retrains the model.
name: monitor

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [dev, staging, prod]
        default: dev
      region:
        description: AWS region of the deployment
        type: choice
        options: [environment default, ap-southeast-1, ap-southeast-2]
        default: environment default
      action:
        description: reference once per model, then report whenever you want to look
        type: choice
        options: [report, reference]
        default: report
      days:
        description: Report only. Days of prediction log to compare
        default: "1"

permissions:
  contents: read
  id-token: write   # OIDC token for AWS; no stored credentials

concurrency:
  group: monitor-${{ inputs.environment }}-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    steps:
      - name: Resolve the region and the deploy role
        id: target
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REGION_INPUT: ${{ inputs.region }}
          DEFAULT_REGION: ${{ vars.AWS_REGION }}
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ROLE_ARN_VAR: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          DAYS: ${{ inputs.days }}
        run: |
          region="$REGION_INPUT"
          [ "$region" != "environment default" ] || region="$DEFAULT_REGION"
          case "$region" in
            ap-southeast-1|ap-southeast-2) ;;
            *) echo "Region '$region' is not supported." >&2; exit 1 ;;
          esac
          case "$DAYS" in ''|*[!0-9]*) echo "days must be a whole number" >&2; exit 1 ;; esac
          if [ -n "$ROLE_ARN_VAR" ]; then
            role="$ROLE_ARN_VAR"
          elif [ -n "$ACCOUNT_ID" ]; then
            role="arn:aws:iam::${ACCOUNT_ID}:role/github-deploy-${ENVIRONMENT}-${region}"
          else
            echo "The '$ENVIRONMENT' environment has neither AWS_ACCOUNT_ID nor AWS_DEPLOY_ROLE_ARN." >&2
            exit 1
          fi
          echo "region=$region" >> "$GITHUB_OUTPUT"
          echo "role=$role" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.target.outputs.role }}
          aws-region: ${{ steps.target.outputs.region }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the tools (locked)
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps -e .

      - name: Build the images for this commit (skipped when they already exist)
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ steps.target.outputs.region }}
          TAG: ${{ github.sha }}
        run: bash scripts/aws_deploy.sh images

      - name: Run it as a task in the VPC
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM_PROD: ${{ inputs.environment == 'prod' && 'yes' || '' }}
          AWS_REGION: ${{ steps.target.outputs.region }}
          TAG: ${{ github.sha }}
          ACTION: ${{ inputs.action }}
          DAYS: ${{ inputs.days }}
        run: |
          case "$ACTION" in
            reference) bash scripts/aws_deploy.sh monitor-reference ;;
            report) bash scripts/aws_deploy.sh monitor-report ;;
            *) echo "unknown action" >&2; exit 1 ;;
          esac
