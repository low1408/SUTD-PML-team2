# Moves @production to a registered model version after the promotion gates pass. The step runs as a one-off
# ECS task in the project's VPC (the MLflow server is private) under the approver role, which is a different
# principal from the training role: whoever registered the version cannot also promote it.
#
# The GitHub environment's required reviewers are the human approval for this step; turn on "Prevent
# self-review" there so the person who starts the run cannot be the one who approves it.
# The reviewer name recorded on the model version is the GitHub user running the workflow, not typed text.
name: promote

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment (staging and prod wait for their reviewers)
        type: choice
        options: [dev, staging, prod]
        default: dev
      region:
        description: AWS region of the deployment
        type: choice
        options: [environment default, ap-southeast-1, ap-southeast-2]
        default: environment default
      model_version:
        description: Registered model version to promote (the number in the approval email or the MLflow UI)
      require_real_data:
        description: Refuse a version trained on the synthetic fixture
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # OIDC token for AWS; no stored credentials

concurrency:
  group: promote-${{ inputs.environment }}-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - name: Resolve the region and the deploy role
        id: target
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REGION_INPUT: ${{ inputs.region }}
          DEFAULT_REGION: ${{ vars.AWS_REGION }}
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ROLE_ARN_VAR: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          VERSION: ${{ inputs.model_version }}
        run: |
          region="$REGION_INPUT"
          [ "$region" != "environment default" ] || region="$DEFAULT_REGION"
          case "$region" in
            ap-southeast-1|ap-southeast-2) ;;
            *) echo "Region '$region' is not supported." >&2; exit 1 ;;
          esac
          case "$VERSION" in ''|*[!0-9]*) echo "model_version must be a whole number" >&2; exit 1 ;; esac
          if [ -n "$ROLE_ARN_VAR" ]; then
            role="$ROLE_ARN_VAR"
          elif [ -n "$ACCOUNT_ID" ]; then
            role="arn:aws:iam::${ACCOUNT_ID}:role/github-deploy-${ENVIRONMENT}-${region}"
          else
            echo "The '$ENVIRONMENT' environment has neither AWS_ACCOUNT_ID nor AWS_DEPLOY_ROLE_ARN." >&2
            exit 1
          fi
          echo "region=$region" >> "$GITHUB_OUTPUT"
          echo "role=$role" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ steps.target.outputs.role }}
          aws-region: ${{ steps.target.outputs.region }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the tools (locked)
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps -e .

      - name: Build the images for this commit (skipped when they already exist)
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ steps.target.outputs.region }}
          TAG: ${{ github.sha }}
        run: bash scripts/aws_deploy.sh images

      - name: Promote as a task under the approver role
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM_PROD: ${{ inputs.environment == 'prod' && 'yes' || '' }}
          AWS_REGION: ${{ steps.target.outputs.region }}
          TAG: ${{ github.sha }}
          MODEL_VERSION: ${{ inputs.model_version }}
          REQUIRE_REAL_DATA: ${{ inputs.require_real_data }}
          REVIEWED_BY: ${{ github.actor }}
        run: bash scripts/aws_deploy.sh promote-task
