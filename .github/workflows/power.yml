# Shows, starts or stops everything in an environment that bills while it is on: the MLflow server, the
# Evidently UI and the database. Manual only, no schedule. Training steps and the scoring Lambda cost nothing
# between uses, so they are not touched.
#
#   status  what is on, what it costs per hour, anything that cannot be stopped (load balancer, NAT gateway)
#   start   database, then the services; --allow opens the tool UIs to one address (your own, x.x.x.x/32)
#   stop    services to zero, database stopped, browser access closed; refuses while a pipeline step runs
#
# Same GitHub environments, variables and OIDC roles as deploy.yml.
name: power

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [dev, staging, prod]
        default: dev
      region:
        description: AWS region of the deployment
        type: choice
        options: [environment default, ap-southeast-1, ap-southeast-2]
        default: environment default
      action:
        description: status shows what is on; start brings the tools up; stop shuts down everything that bills
        type: choice
        options: [status, start, stop]
        default: status
      component:
        description: Which tools (starting the MLflow server also starts its database)
        type: choice
        options: [all, mlflow, evidently, database]
        default: all
      allow_cidr:
        description: Start only. Your address as x.x.x.x/32 to open the tool UIs in a browser (empty = keep them closed)
        default: ""
      allow_anywhere:
        description: Start only. Allow 0.0.0.0/0 in the box above (the tools have no login; use for a short demo only)
        type: boolean
        default: false
      force:
        description: Stop only. Also stop while a pipeline step is running
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # OIDC token for AWS; no stored credentials

concurrency:
  group: power-${{ inputs.environment }}-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  power:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    steps:
      - name: Resolve the region and the deploy role
        id: target
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REGION_INPUT: ${{ inputs.region }}
          DEFAULT_REGION: ${{ vars.AWS_REGION }}
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ROLE_ARN_VAR: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          region="$REGION_INPUT"
          [ "$region" != "environment default" ] || region="$DEFAULT_REGION"
          case "$region" in
            ap-southeast-1|ap-southeast-2) ;;
            *) echo "Region '$region' is not supported. Pick ap-southeast-1 or ap-southeast-2, or set AWS_REGION for the '$ENVIRONMENT' environment." >&2; exit 1 ;;
          esac
          if [ -n "$ROLE_ARN_VAR" ]; then
            role="$ROLE_ARN_VAR"
          elif [ -n "$ACCOUNT_ID" ]; then
            role="arn:aws:iam::${ACCOUNT_ID}:role/github-deploy-${ENVIRONMENT}-${region}"
          else
            echo "The '$ENVIRONMENT' environment has neither AWS_ACCOUNT_ID nor AWS_DEPLOY_ROLE_ARN." >&2
            exit 1
          fi
          echo "region=$region" >> "$GITHUB_OUTPUT"
          echo "role=$role" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ steps.target.outputs.role }}
          aws-region: ${{ steps.target.outputs.region }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the tools (locked)
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps -e .

      # Inputs go through the environment, never into the script text.
      - name: Power ${{ inputs.action }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM_PROD: ${{ inputs.environment == 'prod' && 'yes' || '' }}
          AWS_REGION: ${{ steps.target.outputs.region }}
          ACTION: ${{ inputs.action }}
          COMPONENT: ${{ inputs.component }}
          ALLOW_CIDR: ${{ inputs.allow_cidr }}
          ALLOW_ANYWHERE: ${{ inputs.allow_anywhere }}
          FORCE: ${{ inputs.force }}
        run: |
          args=("$ACTION" --component "$COMPONENT")
          if [ "$ACTION" = start ] && [ -n "$ALLOW_CIDR" ]; then args+=(--allow-cidr "$ALLOW_CIDR"); fi
          if [ "$ACTION" = start ] && [ "$ALLOW_ANYWHERE" = true ]; then args+=(--allow-anywhere); fi
          if [ "$ACTION" = stop ] && [ "$FORCE" = true ]; then args+=(--force); fi
          bash scripts/aws_deploy.sh power "${args[@]}"
