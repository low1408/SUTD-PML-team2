# Deploys to AWS: build once, then dev -> staging -> prod, each from the same image digest.
# Started by hand only. It does nothing until the repository has the variable
# AWS_DEPLOY_ROLE_ARN (per environment) and the matching IAM role trusts GitHub's OIDC
# provider; there are no long-lived AWS keys. "staging" and "prod" should be GitHub
# environments with required reviewers, which is the approval step.
# Changes to this file need owner review.
name: deploy

on:
  workflow_dispatch:
    inputs:
      model_uri:
        description: Registered model to deploy (must already be promoted and published)
        default: models:/sepsis-warning@production
      environments:
        description: How far to go
        type: choice
        options: [dev, dev+staging, dev+staging+prod]
        default: dev

permissions:
  contents: read
  id-token: write   # OIDC token for AWS; no stored credentials

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1

jobs:
  deploy:
    strategy:
      max-parallel: 1          # one environment at a time, in order
      fail-fast: true          # a failed smoke test stops the promotion
      matrix:
        environment: [dev, staging, prod]
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ matrix.environment }}
    steps:
      - name: Skip environments that were not requested
        id: wanted
        run: |
          case "${{ inputs.environments }}:${{ matrix.environment }}" in
            dev:dev|dev+staging:dev|dev+staging:staging|dev+staging+prod:*) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.wanted.outputs.run == 'true'
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        if: steps.wanted.outputs.run == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.wanted.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install the deploy tools (locked)
        if: steps.wanted.outputs.run == 'true'
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps -e .
          python -m pip install "sagemaker-mlflow>=0.5,<1"

      - name: Stack, images, publish, deploy
        if: steps.wanted.outputs.run == 'true'
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          MODEL_URI: ${{ inputs.model_uri }}
          TAG: ${{ github.sha }}
        run: |
          bash scripts/aws_deploy.sh stack
          bash scripts/aws_deploy.sh images
          bash scripts/aws_deploy.sh publish
          bash scripts/aws_deploy.sh serve

      # The canary inside the stack update already rolled back on errors; this checks the result.
      - name: Smoke test the deployed API
        if: steps.wanted.outputs.run == 'true'
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          bash scripts/aws_deploy.sh call GET /health
          bash scripts/aws_deploy.sh call POST /predict \
            '{"stays": [{"patient_id": "smoke-1", "hours": [{"ICULOS": 1, "HR": 92}, {"ICULOS": 2, "HR": 118}]}]}'
