# Builds and pushes the container images for a commit as soon as it is on main, so that a later deploy finds them already in
# the registry and skips the build. It only writes images to ECR (tagged with the commit): it never changes the stack, the
# services or any data. Everything that changes AWS stays in the manual deploy workflow.
#
# Skips quietly when the environment has no stack yet (the first deploy creates the registry). To turn the automatic part off
# set the repository variable AUTO_PREBUILD to false; the manual Run workflow button keeps working.
# Changes to this file need owner review.
name: images

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - requirements/**
      - src/**
      - pyproject.toml
      - scripts/docker_smoke_test.sh
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose registry gets the images
        type: choice
        options: [dev, staging, prod]
        default: dev
      region:
        description: AWS region of the deployment
        type: choice
        options: [environment default, ap-southeast-1, ap-southeast-2]
        default: environment default

permissions:
  contents: read
  id-token: write   # OIDC token for AWS; no stored credentials

concurrency:
  group: images-${{ inputs.environment || 'dev' }}
  cancel-in-progress: true

jobs:
  images:
    if: github.event_name != 'push' || vars.AUTO_PREBUILD != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Resolve the region and the deploy role
        id: target
        env:
          ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          REGION_INPUT: ${{ inputs.region || 'environment default' }}
          DEFAULT_REGION: ${{ vars.AWS_REGION }}
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ROLE_ARN_VAR: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          region="$REGION_INPUT"
          [ "$region" != "environment default" ] || region="$DEFAULT_REGION"
          case "$region" in
            ap-southeast-1|ap-southeast-2) ;;
            *) echo "Region '$region' is not supported. Pick ap-southeast-1 or ap-southeast-2, or set AWS_REGION for the '$ENVIRONMENT' environment." >&2; exit 1 ;;
          esac
          if [ -n "$ROLE_ARN_VAR" ]; then
            role="$ROLE_ARN_VAR"
          elif [ -n "$ACCOUNT_ID" ]; then
            role="arn:aws:iam::${ACCOUNT_ID}:role/github-deploy-${ENVIRONMENT}-${region}"
          else
            echo "The '$ENVIRONMENT' environment has neither AWS_ACCOUNT_ID nor AWS_DEPLOY_ROLE_ARN." >&2
            exit 1
          fi
          echo "region=$region" >> "$GITHUB_OUTPUT"
          echo "role=$role" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.target.outputs.role }}
          aws-region: ${{ steps.target.outputs.region }}

      - name: Is there a stack to hold the images?
        id: stack
        env:
          ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          if aws cloudformation describe-stacks --stack-name "sepsis-$ENVIRONMENT" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "### Nothing built" >> "$GITHUB_STEP_SUMMARY"
            echo "There is no stack sepsis-$ENVIRONMENT yet, so there is no registry. The first deploy creates it and builds the images." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.stack.outputs.exists == 'true'
        with:
          python-version: "3.12"

      - name: Install the tools (locked)
        if: steps.stack.outputs.exists == 'true'
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps -e .

      - name: Build and push the images for this commit (already existing ones are reused)
        if: steps.stack.outputs.exists == 'true'
        env:
          ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          AWS_REGION: ${{ steps.target.outputs.region }}
          TAG: ${{ github.sha }}
          IMAGES_PARALLEL: "1"
        run: |
          bash scripts/aws_deploy.sh images
          echo "### Images pushed for ${GITHUB_SHA:0:12}" >> "$GITHUB_STEP_SUMMARY"
          echo "A later deploy of this commit reuses them and skips the build." >> "$GITHUB_STEP_SUMMARY"
