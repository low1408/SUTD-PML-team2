# L04: quality gates on synthetic fixtures only. No deployment, no secrets,
# no patient data. Changes to this file need owner review.
# Actions are pinned to commit SHAs (the tag is in the comment).
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
      MLFLOW_DISABLE_TELEMETRY: "true"
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Refuse patient data or model files in Git
        run: |
          found=$(git ls-files -- '*.psv' '*.joblib' '*.pkl' '*.pickle' '*.parquet' 'data/*' 'artifacts/*')
          if [ -n "$found" ]; then
            echo "These files must not be committed:"
            echo "$found"
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt

      # The same locked, hash-checked versions the images use (scripts/lock_requirements.sh).
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps -e .
          python -m pip install "ruff>=0.8,<1" "mypy>=1.13,<3" "coverage>=7,<8" "pip-audit>=2.7,<3"

      - name: Lint
        run: ruff check src tests scripts

      - name: Type-check the serving modules
        run: >-
          mypy src/sepsis_warning/api.py src/sepsis_warning/service.py src/sepsis_warning/client.py
          src/sepsis_warning/alert_store.py src/sepsis_warning/telemetry.py src/sepsis_warning/gates.py
          src/sepsis_warning/manifest.py src/sepsis_warning/lambda_app.py src/sepsis_warning/model_source.py
          src/sepsis_warning/live_drift.py src/sepsis_warning/drift_handler.py

      - name: Known vulnerabilities in the locked dependencies
        run: |
          for target in scoring lambda training; do
            pip-audit -r "requirements/$target.txt" --require-hashes --disable-pip
          done

      - name: Notebooks have no stored outputs or copied feature code
        run: python scripts/check_notebooks.py

      - name: Unit, contract, leakage and parity tests (synthetic fixtures)
        run: coverage run --source=src/sepsis_warning -m unittest discover -s tests -v

      # The code that decides features, alerts, serving and promotion must stay well tested.
      - name: Coverage floor on the critical modules
        run: >-
          coverage report --fail-under=85
          --include="src/sepsis_warning/features.py,src/sepsis_warning/policy.py,src/sepsis_warning/service.py,src/sepsis_warning/api.py,src/sepsis_warning/client.py,src/sepsis_warning/alert_store.py,src/sepsis_warning/gates.py,src/sepsis_warning/manifest.py,src/sepsis_warning/evaluation.py,src/sepsis_warning/live_drift.py,src/sepsis_warning/telemetry.py,src/sepsis_warning/model_source.py"

      - name: Causal feature demo script
        run: python scripts/causal_features.py

      - name: End-to-end synthetic demo
        run: |
          python -m sepsis_warning demo \
            --data "$RUNNER_TEMP/synthetic" \
            --output "$RUNNER_TEMP/demo"
          test -f "$RUNNER_TEMP/demo/manifest.json"
          ! test -e "$RUNNER_TEMP/demo/held_out_predictions.csv"

  # L03: build the images from the locked requirements and smoke-test with synthetic data only.
  # Nothing is pushed to a registry.
  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build and smoke-test the scoring image
        run: bash scripts/docker_smoke_test.sh sepsis-warning:ci

      - name: Latency budget on the built image
        run: |
          work="$(mktemp -d)"; chmod 777 "$work"
          docker run --rm -v "$work:/work" --entrypoint python sepsis-warning:ci \
            -m sepsis_warning demo --data /work/synthetic --output /work/demo >/dev/null
          docker run -d --name latency -p 127.0.0.1:18080:8000 -v "$work/demo:/models:ro" sepsis-warning:ci
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1 && break; sleep 1; done
          # Generous budget for shared CI runners: it catches a regression of several times, not noise.
          python3 scripts/latency.py --url http://127.0.0.1:18080 --hours 24 72 --concurrency 1 \
            --requests 60 --max-p95-ms 1500
          docker rm -f latency >/dev/null

      - name: Build the Lambda and SageMaker training images
        run: |
          docker build --target lambda --provenance=false -t sepsis-warning:lambda-ci .
          docker build --target training --provenance=false -t sepsis-warning:training-ci .

      # Report only for now: base-image findings need a first triage before this can block merges.
      - name: Image vulnerability scan (report)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 sepsis-warning:ci

  # CloudFormation structure and resource properties; no AWS credentials, nothing deployed.
  cloudformation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Lint templates
        run: |
          python -m pip install "cfn-lint[sam]>=1.40,<2"
          cfn-lint -t infra/cloudformation/*.yaml --regions ap-southeast-1 ap-southeast-2 --ignore-checks W3002
