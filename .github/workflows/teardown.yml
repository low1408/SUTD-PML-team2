# Removes a deployment from AWS: pick the environment and region, then type the stack name to confirm.
# Started by hand only (Actions -> teardown -> Run workflow). Uses the same GitHub environments,
# variables and OIDC roles as the deploy workflow (see deploy.yml), so staging and prod wait for
# their required reviewers.
#
#   stack only   deletes the CloudFormation stack. Models, data, keys, images and logs are kept.
#   everything   also deletes the retained resources: both S3 buckets with every object version
#                (every published model and training output), the ECR repositories, the DynamoDB
#                table, the log groups, and schedules the KMS key for deletion in 7 days.
#                This cannot be undone.
name: teardown

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to remove (staging and prod wait for their reviewers)
        type: choice
        options: [dev, staging, prod]
        default: dev
      region:
        description: AWS region of the deployment to remove
        type: choice
        options: [environment default, ap-southeast-1, ap-southeast-2]
        default: environment default
      scope:
        description: What to remove
        type: choice
        options: [plan only, stack only, everything]
        default: plan only
      confirm:
        description: To remove anything, type the stack name (sepsis-dev, sepsis-staging or sepsis-prod)
        default: ""

permissions:
  contents: read
  id-token: write   # OIDC token for AWS; no stored credentials

concurrency:
  group: deploy-${{ inputs.environment }}-${{ inputs.region }}   # never overlaps a deploy of the same target
  cancel-in-progress: false

jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    steps:
      - name: Check the confirmation
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SCOPE: ${{ inputs.scope }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$SCOPE" != "plan only" ] && [ "$CONFIRM" != "sepsis-$ENVIRONMENT" ]; then
            echo "To run '$SCOPE' on $ENVIRONMENT, type sepsis-$ENVIRONMENT in the confirm box. Nothing was changed." >&2
            exit 1
          fi

      - name: Resolve the region and the deploy role
        id: target
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REGION_INPUT: ${{ inputs.region }}
          DEFAULT_REGION: ${{ vars.AWS_REGION }}
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ROLE_ARN_VAR: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          region="$REGION_INPUT"
          [ "$region" != "environment default" ] || region="$DEFAULT_REGION"
          case "$region" in
            ap-southeast-1|ap-southeast-2) ;;
            *) echo "Region '$region' is not supported. Pick ap-southeast-1 or ap-southeast-2, or set AWS_REGION for the '$ENVIRONMENT' environment." >&2; exit 1 ;;
          esac
          if [ -n "$ROLE_ARN_VAR" ]; then
            role="$ROLE_ARN_VAR"
          elif [ -n "$ACCOUNT_ID" ]; then
            role="arn:aws:iam::${ACCOUNT_ID}:role/github-deploy-${ENVIRONMENT}-${region}"
          else
            echo "The '$ENVIRONMENT' environment has neither AWS_ACCOUNT_ID nor AWS_DEPLOY_ROLE_ARN." >&2
            echo "Run scripts/bootstrap_github_oidc.sh for this account, or set them in GitHub settings." >&2
            exit 1
          fi
          echo "region=$region" >> "$GITHUB_OUTPUT"
          echo "role=$role" >> "$GITHUB_OUTPUT"
          echo "Teardown of '$ENVIRONMENT' in $region" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ steps.target.outputs.role }}
          aws-region: ${{ steps.target.outputs.region }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the tools (locked)
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps -e .

      - name: Plan, stack only, or everything
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SCOPE: ${{ inputs.scope }}
          AWS_REGION: ${{ steps.target.outputs.region }}
          CONFIRM_PROD: ${{ inputs.environment == 'prod' && 'yes' || '' }}
        run: |
          case "$SCOPE" in
            "plan only") bash scripts/aws_deploy.sh destroy ;;
            "stack only") bash scripts/aws_deploy.sh down ;;
            everything) CONFIRM_DESTROY="sepsis-$ENVIRONMENT" bash scripts/aws_deploy.sh destroy ;;
          esac
