# Stand-in for the internal Application Load Balancer and target group in service.yaml.
# The target group polls GET /health and accepts 200-399; so does this. AWS defaults are a
# 30 s interval, 2 failures to mark a target unhealthy and 5 successes to bring it back;
# the intervals are shortened here so local tests run in seconds.

global
  log stdout format raw local0
  stats socket ipv4@127.0.0.1:9999 level admin  # inside the container only; deploys drain tasks with it

defaults
  mode http
  log global
  option httplog
  timeout connect 1s
  timeout client 60s                         # ALB idle timeout
  timeout server 30s
  retries 2
  option redispatch                          # a retry goes to the other task
  retry-on conn-failure empty-response 503   # /score is a pure function, so a retry is safe

resolvers docker
  nameserver dns 127.0.0.11:53               # Docker DNS, so a replaced task is found again
  hold valid 2s
  hold nx 1s

frontend http
  bind :80
  option forwardfor
  http-response set-header X-Upstream %s     # which task answered (used by the tests)
  default_backend scoring_api

backend scoring_api
  balance roundrobin
  option httpchk GET /health
  http-check expect status 200-399
  default-server check inter 2s fall 2 rise 2 resolvers docker init-addr last,libc,none
  server api-a api-a:8000
  server api-b api-b:8000
